services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cosechaclima-api
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__BD_CosechaClima: ${CONNECTION_STRING}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__SecretKey: ${JWT_SECRET_KEY}
      Jwt__DurationMinutes: ${JWT_DURATION_MINUTES}
      AdminSeed__Telefono: ${ADMIN_SEED_TELEFONO}
      AdminSeed__Pin: ${ADMIN_SEED_PIN}
      AdminSeed__Nombre: ${ADMIN_SEED_NOMBRE}
      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGIN}
      ASPNETCORE_ENVIRONMENT: Development
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - cosechaclima-net

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cosechaclima-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_SA_PASSWORD}
      MSSQL_PID: "Developer"
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - cosechaclima-db-data:/var/opt/mssql
      - ./Scripts:/scripts
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - cosechaclima-net

  db-init:
    image: mcr.microsoft.com/mssql-tools
    container_name: cosechaclima-db-init
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./Scripts:/scripts
    entrypoint: /bin/bash -c "/opt/mssql-tools/bin/sqlcmd -S db -U sa -P \"$$MSSQL_SA_PASSWORD\" -i /scripts/BD-CosechaClima.sql && /opt/mssql-tools/bin/sqlcmd -S db -U sa -P \"$$MSSQL_SA_PASSWORD\" -i /scripts/seed.sql"
    environment:
      MSSQL_SA_PASSWORD: ${DB_SA_PASSWORD}
    networks:
      - cosechaclima-net

networks:
  cosechaclima-net:
    driver: bridge

volumes:
  cosechaclima-db-data: