services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cosechaclima-api
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__BD_CosechaClima: ${CONNECTION_STRING}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__SecretKey: ${JWT_SECRET_KEY}
      Jwt__DurationMinutes: ${JWT_DURATION_MINUTES:-15}
      Jwt__RefreshDays: ${JWT_REFRESH_DAYS:-30}
      Auth__CookieSecure: ${AUTH_COOKIE_SECURE:-true}
      Proxy__KnownProxies__0: ${PROXY_KNOWN_PROXY:-}
      Proxy__KnownNetworks__0: ${PROXY_KNOWN_NETWORK:-}
      AdminSeed__Email: ${ADMIN_SEED_EMAIL}
      AdminSeed__Password: ${ADMIN_SEED_PASSWORD}
      AdminSeed__Nombre: ${ADMIN_SEED_NOMBRE}
      GoogleAuth__ClientIds__0: ${GOOGLE_CLIENT_ID_ANDROID}
      GoogleAuth__ClientIds__1: ${GOOGLE_CLIENT_ID_IOS}
      GoogleAuth__ClientIds__2: ${GOOGLE_CLIENT_ID_WEB}
      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGIN}
      Cors__AllowedOrigins__1: ${ADMIN_CONSOLE_ORIGIN:-http://localhost:5174}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - cosechaclima-net

  adminconsole:
    build:
      context: ./adminconsole
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${ADMIN_CONSOLE_API_URL:-http://localhost:8080}
    container_name: cosechaclima-adminconsole
    environment:
      # origen de la API: se inserta en el Content-Security-Policy (connect-src) del nginx
      API_ORIGIN: ${ADMIN_CONSOLE_API_URL:-http://localhost:8080}
    ports:
      - "5174:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - cosechaclima-net

  db:
    # PostgreSQL 18 (version mayor vigente). Licencia PostgreSQL: libre, uso comercial permitido.
    image: postgres:18
    container_name: cosechaclima-db
    environment:
      # "postgres" es el superusuario, reservado para administracion.
      # La API NO lo usa: se conecta con un rol propio sin privilegios de superusuario
      # que crea backend/Scripts/db-init/01-roles.sh la primera vez que arranca el volumen.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD}
      APP_DB_PASSWORD: ${DB_APP_PASSWORD}
      APP_DB_NAME: ${DB_NAME:-cosechaclima}
      APP_DB_USER: ${DB_APP_USER:-cosechaclima_app}
    ports:
      # solo accesible desde tu propia maquina (no expuesto a la red)
      - "127.0.0.1:5432:5432"
    volumes:
      # postgres:18 guarda los datos en /var/lib/postgresql/<version> y espera el volumen en
      # /var/lib/postgresql (no en .../data como las versiones anteriores).
      - cosechaclima-db-data:/var/lib/postgresql
      - ./backend/Scripts/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1 fuerza TCP: durante la inicializacion el servidor temporal solo escucha por
      # socket unix, asi el healthcheck solo pasa cuando el servidor definitivo ya esta listo.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - cosechaclima-net

networks:
  cosechaclima-net:
    driver: bridge

volumes:
  cosechaclima-db-data:
