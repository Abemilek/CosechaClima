<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowDashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="620" fill="#f8fafc"/>

  <!-- Cliente -->
  <rect x="370" y="20" width="160" height="60" rx="10" fill="#0EA5E9"/>
  <text x="450" y="45" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="600">App móvil</text>
  <text x="450" y="64" text-anchor="middle" fill="#e0f2fe" font-size="12">Flutter</text>

  <!-- Backend group -->
  <rect x="120" y="130" width="660" height="330" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="145" y="155" fill="#64748b" font-size="13" font-weight="600">BACKEND · ASP.NET Core (.NET 10)</text>

  <!-- WebApi -->
  <rect x="370" y="175" width="160" height="60" rx="10" fill="#512BD4"/>
  <text x="450" y="200" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="600">WebApi</text>
  <text x="450" y="219" text-anchor="middle" fill="#ddd6fe" font-size="11">Controllers · Auth JWT</text>

  <!-- Interface -->
  <rect x="370" y="270" width="160" height="60" rx="10" fill="#7C5CFF"/>
  <text x="450" y="295" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600">WebApi.Interface</text>
  <text x="450" y="314" text-anchor="middle" fill="#ede9fe" font-size="11">Contratos de servicio</text>

  <!-- Implementation -->
  <rect x="360" y="365" width="180" height="65" rx="10" fill="#512BD4"/>
  <text x="450" y="390" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600">WebApi.Implementation</text>
  <text x="450" y="410" text-anchor="middle" fill="#ddd6fe" font-size="11">Motor de decisiones · 216 reglas</text>

  <!-- Models -->
  <rect x="600" y="365" width="150" height="65" rx="10" fill="#8B5CF6"/>
  <text x="675" y="392" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600">WebApi.Models</text>
  <text x="675" y="411" text-anchor="middle" fill="#ede9fe" font-size="11">Entidades</text>

  <!-- SQL Server -->
  <rect x="150" y="530" width="180" height="65" rx="10" fill="#CC2927"/>
  <text x="240" y="557" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600">SQL Server 2022</text>
  <text x="240" y="576" text-anchor="middle" fill="#fecaca" font-size="11">Docker</text>

  <!-- Open-Meteo -->
  <rect x="560" y="530" width="180" height="65" rx="10" fill="#22C55E"/>
  <text x="650" y="557" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600">Open-Meteo</text>
  <text x="650" y="576" text-anchor="middle" fill="#dcfce7" font-size="11">Pronóstico climático</text>

  <!-- Arrows -->
  <line x1="450" y1="80" x2="450" y2="175" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="465" y="130" fill="#475569" font-size="11">HTTPS / JSON</text>

  <line x1="450" y1="235" x2="450" y2="270" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="330" x2="450" y2="365" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="540" y1="397" x2="600" y2="397" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowDashed)"/>
  <text x="548" y="390" fill="#64748b" font-size="10">usa</text>

  <path d="M 400 430 C 340 470, 280 490, 240 530" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M 500 430 C 560 470, 610 490, 640 530" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="560" y="475" fill="#475569" font-size="11">IProveedorClimaticoService</text>

  <!-- Legend -->
  <text x="145" y="608" fill="#94a3b8" font-size="10">CosechaClima — arquitectura en capas: cada capa solo conoce a la inmediatamente inferior mediante una interfaz.</text>
</svg>
