name: mobile
description: "CosechaClima — alerta agroclimática para pequeños productores de Carazo, Nicaragua."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  http: ^1.2.2

  provider: ^6.1.2

  shared_preferences: ^2.3.3

  flutter_secure_storage: ^11.2.0

  intl: ^0.19.0

  url_launcher: ^6.3.2

  geolocator: ^13.0.4

  device_info_plus: ^13.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#F4EAD5"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true
